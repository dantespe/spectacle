<!DOCTYPE html>
{{template "top" .}}
<script>
async function get() {
  const response = await fetch("http://localhost:8080/rest/data/3");
  const data = await response.json();

  var rows = '<thread><tr>';
  // Add Headers
  $.each(data["results"], function(i, v) {
    rows += '<th scope="col">' + v["displayName"] + '</th>';
  })
  rows += '</tr></thread>'

  // Add Body
  rows +=  '<tbody>';
  var num_cols = data["results"].length;
  if (num_cols > 0 && data["results"][0]["rows"].length > 0) {
    var num_rows = data["results"][0]["rows"].length
    for (let r = 0; r < num_rows; r++) {
        rows += '<tr>';
        for (let c = 0; c < num_cols; c++) {
            console.log("Col: " + c + " " + data["results"][c]["rows"].length)
            rows += '<td>'+ data["results"][c]["rows"][r] +'</td>';
            // rows +=  '<td><input type="text" placeholder="' + data["results"][c]["rows"][r] + '"></td>';
            // rows +=  '<td><input type="text" placeholder="' + data["results"][c]["rows"][r] + '"></td>';
        }
        rows += '</tr>';
    }
  }
  rows +=  '</tbody>';
  $('#table').html(rows);
}
get();
</script>
<div class="table-responsive-md">
    <table class="table table-striped table-hover" id="table"></table>
</div>
{{template "bottom" .}}
